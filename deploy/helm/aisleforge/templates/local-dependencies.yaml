{{- if .Values.localDependencies.enabled }}
{{- $d := .Values.localDependencies }}
# LOCAL CLUSTERS ONLY (kind/k3d): single-replica stateful services with PersistentVolumeClaims so data survives pod
# restarts. Not highly available and not a production data tier — production uses managed services (values.yaml).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "af.name" . }}-postgres
  labels: {{- include "af.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "af.name" . }}-postgres
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: postgres } }
  template:
    metadata: { labels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: postgres } }
    spec:
      containers:
        - name: postgres
          image: {{ $d.postgres.image }}
          env:
            - { name: POSTGRES_USER, value: aisleforge }
            - { name: POSTGRES_DB, value: aisleforge }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.existingSecret }}, key: POSTGRES_PASSWORD } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          args: ["-c", "max_connections=120", "-c", "shared_buffers=64MB"]
          ports: [{ name: pg, containerPort: 5432 }]
          readinessProbe: { exec: { command: ["pg_isready", "-U", "aisleforge"] }, periodSeconds: 5 }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: "1", memory: 384Mi } }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- if $d.storageClass }}
        storageClassName: {{ $d.storageClass }}
        {{- end }}
        resources: { requests: { storage: {{ $d.postgres.storage }} } }
---
apiVersion: v1
kind: Service
metadata: { name: {{ include "af.name" . }}-postgres }
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: postgres }
  ports: [{ name: pg, port: 5432, targetPort: pg }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "af.name" . }}-kafka
  labels: {{- include "af.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "af.name" . }}-kafka
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: kafka } }
  template:
    metadata: { labels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: kafka } }
    spec:
      securityContext: { fsGroup: 1000 }
      containers:
        - name: kafka
          image: {{ $d.kafka.image }}
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://{{ include "af.name" . }}-kafka:9092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_HEAP_OPTS, value: "-Xms256m -Xmx256m" }
          ports: [{ name: kafka, containerPort: 9092 }]
          readinessProbe: { tcpSocket: { port: kafka }, periodSeconds: 10, initialDelaySeconds: 15 }
          resources: { requests: { cpu: 200m, memory: 512Mi }, limits: { cpu: "1", memory: 768Mi } }
          volumeMounts: [{ name: data, mountPath: /var/lib/kafka/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- if $d.storageClass }}
        storageClassName: {{ $d.storageClass }}
        {{- end }}
        resources: { requests: { storage: {{ $d.kafka.storage }} } }
---
apiVersion: v1
kind: Service
metadata: { name: {{ include "af.name" . }}-kafka }
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: kafka }
  ports: [{ name: kafka, port: 9092, targetPort: kafka }]
{{- if $d.redis.enabled }}
---
# Redis: cache + shared limits only; no persistence by design (never a system of record).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "af.name" . }}-redis
  labels: {{- include "af.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: redis } }
  template:
    metadata: { labels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: redis } }
    spec:
      containers:
        - name: redis
          image: {{ $d.redis.image }}
          args: ["--save", "", "--appendonly", "no", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru"]
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe: { exec: { command: ["redis-cli", "ping"] }, periodSeconds: 5 }
          resources: { requests: { cpu: 50m, memory: 32Mi }, limits: { cpu: 250m, memory: 96Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: {{ include "af.name" . }}-redis }
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: redis }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
{{- end }}
{{- end }}
