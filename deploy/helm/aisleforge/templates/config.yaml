apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "af.name" . }}-config
  labels: {{- include "af.labels" . | nindent 4 }}
data:
  NODE_ENV: production
  LOG_LEVEL: {{ .Values.config.LOG_LEVEL | quote }}
  KAFKA_BROKERS: {{ .Values.config.KAFKA_BROKERS | quote }}
  CORS_ORIGINS: {{ .Values.config.PUBLIC_ORIGIN | quote }}
  TRUST_PROXY: {{ .Values.config.TRUST_PROXY | quote }}
  COOKIE_SECURE: {{ .Values.config.COOKIE_SECURE | quote }}
  PORT: "8080"
  WORKER_STATUS_PORT: "8081"
---
{{- if .Values.secrets.create }}
# Local clusters only. Values are supplied at install time (--set secrets.values.KEY=…); never committed.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.existingSecret }}
  labels: {{- include "af.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.values }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
