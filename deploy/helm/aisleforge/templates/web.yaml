apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "af.name" . }}-web
  labels: {{- include "af.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web } }
  template:
    metadata:
      labels: {{- include "af.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      securityContext: {{- include "af.podSecurity" (dict "uid" 101) | nindent 8 }}
      containers:
        - name: web
          image: {{ include "af.image" (dict "root" . "component" "web") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 8080 }]
          env:
            # Fully qualified: nginx re-resolves the upstream with its own resolver (so a replaced API pod/IP is picked
            # up), and that resolver ignores resolv.conf search domains, so a short Service name fails (found on kind).
            - { name: API_UPSTREAM, value: "{{ include "af.name" . }}-api.{{ .Release.Namespace }}.svc.{{ .Values.clusterDomain | default "cluster.local" }}:8080" }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5 }
          # Same endpoint-propagation race as the API: wait before nginx's graceful stop (Kubernetes >= 1.30).
          lifecycle: { preStop: { sleep: { seconds: 10 } } }
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext: {{- include "af.containerSecurity" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "af.name" . }}-web
  labels: {{- include "af.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web }
  ports: [{ name: http, port: 8080, targetPort: http }]
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "af.name" . }}
  labels: {{- include "af.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls: [{ hosts: [{{ .Values.ingress.host | quote }}], secretName: {{ .Values.ingress.tls.secretName }} }]
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Everything goes through the web tier (same origin for the PWA, its cookie and CSRF Origin checks).
          - { path: /, pathType: Prefix, backend: { service: { name: {{ include "af.name" . }}-web, port: { name: http } } } }
{{- end }}
